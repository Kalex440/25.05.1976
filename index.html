<script>
/* SHA-256 synchrone (pour garder l'ouverture du nouvel onglet dans le clic) */
function sha256(s){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(s)), l=b.length*8;
  b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(Math.floor(l/2**(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,c,d,e,f,g,h,k]=H; // a,b,c,d,e,f,g,h
    for(let i=0;i<64;i++){
      const S1=r(f,6)^r(f,11)^r(f,25), ch=(f&g)^(~f&h), t1=(k+S1+ch+K[i]+w[i])|0;
      const S0=r(a,2)^r(a,13)^r(a,22), mj=(a&c)^(a&d)^(c&d), t2=(S0+mj)|0;
      k=h; h=g; g=f; f=(e+t1)|0; e=d; d=c; c=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+c)|0,(H[2]+d)|0,(H[3]+e)|0,(H[4]+f)|0,(H[5]+g)|0,(H[6]+h)|0,(H[7]+k)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
const LOGIN_HASH="6b6e0f805c218c8e6aef8b2e3945f73d3facc3329b32287c51c517271649b0c8";
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const id=document.getElementById("lid").value.trim().toLowerCase(), pw=document.getElementById("lpw").value;
  if(sha256(id+":"+pw)!==LOGIN_HASH){ document.getElementById("lerr").textContent="Identifiant ou mot de passe incorrect."; document.getElementById("lpw").value=""; return; }
  try{ localStorage.setItem("auth",JSON.stringify({ok:true,t:Date.now(),rem:document.getElementById("lrem").checked})); }catch(err){}
  const dest="revisions.html"+location.hash, w=window.open(dest,"_blank");
  if(!w){ location.href=dest; return; }
  document.querySelector("#opened a").href=dest;
  document.getElementById("formFields").classList.add("hide");
  document.getElementById("opened").classList.remove("hide");
});
</script>
